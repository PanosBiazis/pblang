[package]
name = "pblang-workspace"
version = "0.5.7"
description = "pblang programming language workspace"
entry = "src/main.sapp"

[dependencies]
# Bootstrap compatibility: the retained resolver interprets a nested locked path
# from the caller CWD instead of this manifest directory. This sibling-relative
# spelling resolves to the same tree both from products/pblang and from sibling
# products such as pb-mcp-server. The PBLang-native resolver will remove this
# workaround once it owns package loading end to end.
stdlib = { path = "../pblang/stdlib", paths = ["stdlib"] }

[metadata]
language = "pblang"
edition = "2024"
homepage = "https://github.com/PanosBiazis/pblang"
license = "MIT"
