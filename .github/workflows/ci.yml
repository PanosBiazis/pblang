name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-rust-linux:
    name: Sovereign Zero-Rust VM & Native Toolchain (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build ~375 KiB Sovereign Zero-Rust Linux Host Runtime
        run: |
          gcc -O3 -std=gnu99 -Wall -Wno-unused-function -Werror=implicit-function-declaration \
            runtime_stage3/pblang_zero_rust_vm.c -ldl -lpthread -lm -s -o pblang
          ./pblang --version
          test "$(nm -D ./pblang 2>/dev/null | grep -c '_ZN' || true)" -eq 0
          ls -lh ./pblang
      - name: Run Sovereign Zero-Rust VM & Compiler Suite
        env:
          PBLANG_BIN: ${{ github.workspace }}/pblang
        run: ./pblang run tests/zero_rust_vm_test.sapp --allow-all
      - name: Run 3-Stage Self-Hosting Native Compilers Suite (ELF64, ELF64-dyn, PE32+)
        env:
          PBLANG_BIN: ${{ github.workspace }}/pblang
        run: ./pblang run tests/path_b_native_sovereign_test.sapp --allow-all
      - name: Run Multi-Accelerator Hardware Governor & Studio UI Suite
        env:
          PBLANG_BIN: ${{ github.workspace }}/pblang
        run: ./pblang run tests/hardware_governor_and_studio_ui_test.sapp --allow-all
      - name: Run Smart Updater, Quantum/PQC, Safety & Public Release Readiness Suites
        env:
          PBLANG_BIN: ${{ github.workspace }}/pblang
        run: |
          ./pblang run tests/smart_updater_test.sapp --allow-all
          ./pblang run tests/algorithms_quantum_pqc_bio_test.sapp --allow-all
          ./pblang run tests/safety_test.sapp --allow-all
          ./pblang run tests/public_release_readiness_test.sapp --allow-all

  zero-rust-windows:
    name: Sovereign Zero-Rust VM & Native Toolchain (Windows x86-64)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build ~365 KiB Sovereign Zero-Rust Windows PE32+ Runtime
        shell: bash
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          gcc -O3 -std=gnu99 -Wall -Wno-unused-function \
            runtime_stage3/pblang_zero_rust_vm.c -lws2_32 -lwinhttp -lgdi32 -luser32 -lbcrypt -s -o pblang.exe
          ./pblang.exe --version
          ls -lh ./pblang.exe
      - name: Verify Windows Zero-Rust Execution, SQLite, Crypto & Sandbox
        shell: bash
        run: |
          ./pblang.exe check stdlib/hardware_governor.sapp
          ./pblang.exe check stdlib/pqc_mlkem768.sapp
          ./pblang.exe run tests/safety_test.sapp --allow-all
          ./pblang.exe run tests/algorithms_quantum_pqc_bio_test.sapp --allow-all

  docs-and-hygiene:
    name: Docs Integrity & Public Privacy Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify Markdown Links, Manifests & Zero Local Path Leaks
        run: |
          python3 - <<'PY'
          import re, tomllib
          from pathlib import Path

          toml = tomllib.loads(Path("pblang.toml").read_text(encoding="utf-8"))
          assert toml["package"]["version"] == "2.0.0", f"Unexpected version: {toml}"
          lock_text = Path("pblang.lock").read_text(encoding="utf-8")
          assert "/home/" not in lock_text and "/media/" not in lock_text, "Absolute path leaked in pblang.lock"

          md_files = [
              "README.md", "SECURITY.md", "CONTRIBUTING.md", "CHANGELOG.md",
              "docs/README.md", "tests/README.md", "examples/README.md",
              "bench/README.md", "bench/secure_archive/README.md",
              "emulators/README.md", "tools/README.md"
          ]
          broken = []
          for mf in md_files:
              p = Path(mf)
              text = p.read_text(encoding="utf-8")
              for m in re.finditer(r'\[([^\]]+)\]\(([^)]+)\)', text):
                  target = m.group(2).strip()
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  clean = target.split("#")[0]
                  if clean and not (p.parent / clean).exists():
                      broken.append(f"{mf}: [{m.group(1)}]({target})")
          if broken:
              raise SystemExit("Broken relative markdown links:\n" + "\n".join(broken))
          print(f"Verified {len(md_files)} documentation indexes and manifests cleanly (v2.0.0).")
          PY
