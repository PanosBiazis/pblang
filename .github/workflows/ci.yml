name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-rust-linux:
    name: Sovereign Zero-Rust VM & Native Toolchain (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build ~411 KiB Sovereign Zero-Rust Linux Host Runtime
        run: |
          gcc -O3 -std=gnu99 -Wall -Wno-unused-function -Werror=implicit-function-declaration \
            runtime_stage3/pblang_zero_rust_vm.c -ldl -lpthread -lm -s -o pblang
          ./pblang --version
          test "$(nm -D ./pblang 2>/dev/null | grep -c '_ZN' || true)" -eq 0
          ls -lh ./pblang
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Run Sovereign Zero-Rust VM & Compiler Suite
        env:
          PBLANG_BIN: ${{ github.workspace }}/pblang
        run: ./pblang run tests/zero_rust_vm_test.sapp --allow-all
      - name: Run 3-Stage Self-Hosting Native Compilers Suite (ELF64, ELF64-dyn, PE32+)
        env:
          PBLANG_BIN: ${{ github.workspace }}/pblang
        run: ./pblang run tests/path_b_native_sovereign_test.sapp --allow-all
      - name: Run Multi-Accelerator Hardware Governor & Studio UI Suite
        env:
          PBLANG_BIN: ${{ github.workspace }}/pblang
        run: ./pblang run tests/hardware_governor_and_studio_ui_test.sapp --allow-all
      - name: Run Smart Updater, MSC2020 Universal Mathematics, Omni-Polyglot (1945..2026+), <= 32-bit Universal Devices, Quantum/PQC, Safety & Readiness Suites
        env:
          PBLANG_BIN: ${{ github.workspace }}/pblang
        run: |
          ./pblang run tests/v3_vm_jit_taint_caps_replay_ffi_test.sapp --allow-all
          ./pblang run tests/v3_static_si_contracts_lsp_test.sapp --allow-all
          ./pblang run tests/v3_wasm_aot_async_rad_rea_test.sapp --allow-all
          ./pblang run tests/quantum_heron_isa_test.sapp --allow-all
          ./pblang run tests/quantum_qem_density_tomography_test.sapp --allow-all
          ./pblang run tests/quantum_qec_stabilizer_test.sapp --allow-all
          ./pblang run tests/quantum_algorithms_heavyhex_test.sapp --allow-all
          ./pblang run tests/quantum_multimodal_and_compile_safety_test.sapp --allow-all
          ./pblang run tests/mathematics_omni_suite_test.sapp --allow-all
          ./pblang run tests/math_interactive_omni_studio_test.sapp --allow-all
          ./pblang run tests/universal_concept_cards_and_si_test.sapp --allow-all
          ./pblang run tests/decidable_cic_hpc_handwriting_test.sapp --allow-all
          ./pblang run tests/math_pure_foundations_test.sapp --allow-all
          ./pblang run tests/math_complex_riemann_stochastic_test.sapp --allow-all
          ./pblang run tests/math_interdisciplinary_world_canon_test.sapp --allow-all
          ./pblang run tests/polyglot_omni_eras_test.sapp --allow-all
          ./pblang run tests/sub32_and_universal_devices_test.sapp --allow-all
          ./pblang run tests/smart_updater_test.sapp --allow-all
          ./pblang run tests/algorithms_quantum_pqc_bio_test.sapp --allow-all
          ./pblang run tests/safety_test.sapp --allow-all
          ./pblang run tests/public_release_readiness_test.sapp --allow-all

  zero-rust-windows:
    name: Sovereign Zero-Rust VM & Native Toolchain (Windows x86-64)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build ~1.0 MiB Sovereign Zero-Rust v3.0.0 Windows PE32+ Runtime
        shell: bash
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          gcc -O2 -fno-strict-aliasing -mstackrealign -std=gnu99 -Wall -Wno-unused-function -Wl,--stack,16777216 \
            runtime_stage3/pblang_zero_rust_vm.c -lws2_32 -lwinhttp -lgdi32 -luser32 -lbcrypt -s -o pblang.exe
          ./pblang.exe --version
          ls -lh ./pblang.exe
      - name: Verify Windows Zero-Rust v3.0.0 JIT, Static Checker, Full Quantum Suite, MSC2020 Mathematics, Omni-Polyglot & Sandbox
        shell: bash
        run: |
          ./pblang.exe check stdlib/mathematics.sapp
          ./pblang.exe check --syntax-only stdlib/polyglot_universal.sapp
          ./pblang.exe check stdlib/hardware_governor.sapp
          ./pblang.exe check stdlib/pqc_mlkem768.sapp
          ./pblang.exe run tests/v3_vm_jit_taint_caps_replay_ffi_test.sapp --allow-all
          ./pblang.exe run tests/v3_static_si_contracts_lsp_test.sapp --allow-all
          ./pblang.exe run tests/v3_wasm_aot_async_rad_rea_test.sapp --allow-all
          ./pblang.exe run tests/quantum_heron_isa_test.sapp --allow-all
          ./pblang.exe run tests/quantum_qem_density_tomography_test.sapp --allow-all
          ./pblang.exe run tests/quantum_qec_stabilizer_test.sapp --allow-all
          ./pblang.exe run tests/quantum_algorithms_heavyhex_test.sapp --allow-all
          ./pblang.exe run tests/quantum_multimodal_and_compile_safety_test.sapp --allow-all
          ./pblang.exe run tests/mathematics_omni_suite_test.sapp --allow-all
          ./pblang.exe run tests/math_interactive_omni_studio_test.sapp --allow-all
          ./pblang.exe run tests/universal_concept_cards_and_si_test.sapp --allow-all
          ./pblang.exe run tests/decidable_cic_hpc_handwriting_test.sapp --allow-all
          ./pblang.exe run tests/math_pure_foundations_test.sapp --allow-all
          ./pblang.exe run tests/math_complex_riemann_stochastic_test.sapp --allow-all
          ./pblang.exe run tests/math_interdisciplinary_world_canon_test.sapp --allow-all
          ./pblang.exe run tests/sub32_and_universal_devices_test.sapp --allow-all
          ./pblang.exe run tests/safety_test.sapp --allow-all
          ./pblang.exe run tests/algorithms_quantum_pqc_bio_test.sapp --allow-all

  docs-and-hygiene:
    name: Docs Integrity & Public Privacy Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify Markdown Links, Manifests & Zero Local Path Leaks
        run: |
          python3 - <<'PY'
          import re, subprocess, tomllib
          from pathlib import Path

          toml = tomllib.loads(Path("pblang.toml").read_text(encoding="utf-8"))
          assert toml["package"]["version"] == "3.0.0", f"Unexpected version: {toml}"
          lock_text = Path("pblang.lock").read_text(encoding="utf-8")
          assert "/home/" not in lock_text and "/media/" not in lock_text, "Absolute path leaked in pblang.lock"

          forbidden = ["/home/pan", "/media/pan", "Ext" + "HD", "SPSSD" + "T7", "@gmail.com"]
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          leaks = []
          for rel in tracked:
              if rel == ".github/workflows/ci.yml":
                  continue
              p = Path(rel)
              if not p.is_file():
                  continue
              data = p.read_bytes()
              for pat in forbidden:
                  if pat.encode("utf-8") in data:
                      leaks.append(f"{rel}: contains forbidden local marker '{pat}'")
          if leaks:
              raise SystemExit("Public privacy check failed:\n" + "\n".join(leaks))

          md_files = [
              "README.md", "SECURITY.md", "CONTRIBUTING.md", "CHANGELOG.md",
              "docs/README.md", "tests/README.md", "examples/README.md",
              "bench/README.md", "bench/secure_archive/README.md",
              "emulators/README.md", "tools/README.md"
          ]
          broken = []
          for mf in md_files:
              p = Path(mf)
              text = p.read_text(encoding="utf-8")
              for m in re.finditer(r'\[([^\]]+)\]\(([^)]+)\)', text):
                  target = m.group(2).strip()
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  clean = target.split("#")[0]
                  if clean and not (p.parent / clean).exists():
                      broken.append(f"{mf}: [{m.group(1)}]({target})")
          if broken:
              raise SystemExit("Broken relative markdown links:\n" + "\n".join(broken))
          print(f"Verified {len(md_files)} documentation indexes, {len(tracked)} tracked files, and manifests cleanly (v3.0.0).")
          PY
