name: Source validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate tracked source and package metadata (100% Pure PBLang)
        shell: bash
        run: |
          gcc -O2 -std=gnu99 -Wno-unused-function runtime_stage3/pblang_zero_rust_vm.c -ldl -lpthread -lm -o pblang
          ./pblang run tools/ci_source_validation.sapp --allow-all
