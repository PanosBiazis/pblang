name: VM Lab Hosted Matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: vm-lab-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sovereign-hosted:
    name: Sovereign Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-24.04-x64
            runner: ubuntu-24.04
            python: python3
            binary: pblang
            cflags: "-ldl -lpthread -lm -s"
          - target: windows-2025-x64
            runner: windows-2025
            python: python
            binary: pblang.exe
            cflags: "-lws2_32 -lwinhttp -lgdi32 -luser32 -lbcrypt -s"
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Zero-Rust runtime, run hosted checks, and bind evidence
        shell: bash
        env:
          TARGET_ID: ${{ matrix.target }}
          PYTHON_CMD: ${{ matrix.python }}
          PBLANG_BINARY: ${{ matrix.binary }}
          PLATFORM_LIBS: ${{ matrix.cflags }}
        run: |
          set -u
          set +e
          if [ -d "/c/msys64/mingw64/bin" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
          fi
          mkdir -p vm-lab-results/logs
          : > vm-lab-results/checks
          run_check() {
            local name="$1"
            shift
            "$@" >"vm-lab-results/logs/${name}.log" 2>&1
            local status=$?
            cat "vm-lab-results/logs/${name}.log"
            printf '%s=%s:%s\n' "$name" "$status" "vm-lab-results/logs/${name}.log" >> vm-lab-results/checks
            return 0
          }
          run_check source-clean git diff --exit-code --no-ext-diff
          run_check index-clean git diff --cached --exit-code --no-ext-diff
          run_check zero-rust-build gcc -O3 -std=gnu99 -Wall -Wno-unused-function runtime_stage3/pblang_zero_rust_vm.c $PLATFORM_LIBS -o "$PBLANG_BINARY"
          run_check version-verify "./$PBLANG_BINARY" --version
          run_check safety-suite "./$PBLANG_BINARY" run tests/safety_test.sapp --allow-all
          run_check studio-governor "./$PBLANG_BINARY" run tests/hardware_governor_and_studio_ui_test.sapp --allow-all
          report_args=()
          while IFS= read -r check; do report_args+=(--check "$check"); done < vm-lab-results/checks
          "$PYTHON_CMD" tools/vm_lab_hosted_report.py record \
            --target "$TARGET_ID" --evidence hosted-vm \
            --output vm-lab-results/native.json \
            --artifact "pblang=$PBLANG_BINARY" \
            "${report_args[@]}"
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pblang-${{ matrix.target }}-${{ github.sha }}
          path: |
            vm-lab-results/native.json
            vm-lab-results/logs/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce native evidence
        if: always()
        shell: bash
        env:
          PYTHON_CMD: ${{ matrix.python }}
        run: "$PYTHON_CMD tools/vm_lab_hosted_report.py verify vm-lab-results/native.json"
