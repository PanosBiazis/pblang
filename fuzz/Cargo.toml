[package]
name = "pblang-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# This is a `cargo fuzz` harness, not a regular workspace member.
# The root `Cargo.toml` excludes `fuzz/` from the workspace.
#
# Running:
#   cargo install cargo-fuzz       # one-time, needs nightly toolchain
#   cargo +nightly fuzz run parse
#   cargo +nightly fuzz run parse_strict
#
# Each target reads from libFuzzer's in-memory corpus; persistent crash
# inputs land under `fuzz/artifacts/<target>/`. See `docs/Fuzzing.md`.

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pblang-core = { path = "../crates/pblang-core" }
pblang-pm = { path = "../crates/pblang-pm" }

# Each fuzz target is a separate binary with `#![no_main]`.
# `test = false` / `doc = false` keep stable-Rust `cargo test --workspace`
# from trying to compile these (the targets only build on nightly with
# libFuzzer linkage).

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_strict"
path = "fuzz_targets/parse_strict.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_index"
path = "fuzz_targets/registry_index.rs"
test = false
doc = false
bench = false
