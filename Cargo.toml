[package]
name = "pblang"
version = "0.5.0"
edition = "2021"
autotests = false
description = "A fast, secure, embeddable programming language with bytecode VM"
license = "MIT"
keywords = ["language", "interpreter", "bytecode", "vm", "embedded"]
categories = ["compilers", "command-line-utilities"]

[workspace]
members = [
    "crates/pblang-core",
    "crates/pblang-ir",
    "crates/pblang-vm",
    "crates/pblang-compiler",
    "crates/pblang-typeck",
    "crates/pblang-ffi",
    "crates/pblang-pm",
    "crates/pblang-lsp",
    "crates/pblang-graphics",
    "crates/pblang-stub",
    "crates/pblang-cranelift",
    "crates/pblang-ctranspiler",
    "crates/pblang-ai",
    "crates/pblang-quantum",
    "crates/pblang-wasm",
    "crates/pblang-llvm",
]

[dependencies]
pblang-core        = { path = "crates/pblang-core" }
pblang-ir          = { path = "crates/pblang-ir" }
pblang-vm          = { path = "crates/pblang-vm" }
pblang-compiler    = { path = "crates/pblang-compiler" }
pblang-typeck      = { path = "crates/pblang-typeck" }
pblang-pm          = { path = "crates/pblang-pm" }
pblang-graphics    = { path = "crates/pblang-graphics" }
pblang-ctranspiler = { path = "crates/pblang-ctranspiler" }
pblang-llvm = { path = "crates/pblang-llvm" }
pblang-wasm = { path = "crates/pblang-wasm" }
pblang-lsp = { path = "crates/pblang-lsp" }
chumsky            = "0.8"
serde_json         = "1.0"
walkdir            = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std"] }
threadpool = "1"

[dev-dependencies]
criterion  = "0.5"
flate2     = "1.0"
tar        = "0.4"
tempfile   = "3"
sha2       = "0.10"
hex        = "0.4"
pblang-cranelift = { path = "crates/pblang-cranelift" }
pblang-ir        = { path = "crates/pblang-ir" }

[[bin]]
name = "pblang"
path = "src/main.rs"

[[bench]]
name    = "bench_vm"
harness = false
path    = "benches/bench_vm.rs"

[[test]]
name = "semantics"
path = "tests/semantics.rs"

[[test]]
name = "pack"
path = "tests/pack.rs"

[[test]]
name = "cfg"
path = "tests/cfg.rs"

[[test]]
name = "new_cmd"
path = "tests/new_cmd.rs"

[[test]]
name = "lsp"
path = "tests/lsp.rs"

[[test]]
name = "install_cli"
path = "tests/install_cli.rs"

[[test]]
name = "threads"
path = "tests/threads.rs"

[[test]]
name = "typeck_compiler"
path = "tests/typeck_compiler.rs"

[[test]]
name = "lockfile_repro"
path = "tests/lockfile_repro.rs"

[[test]]
name = "tensor_builtins"
path = "tests/tensor_builtins.rs"

[[test]]
name = "signal_builtins"
path = "tests/signal_builtins.rs"

[[test]]
name = "neural_net_builtins"
path = "tests/neural_net_builtins.rs"

[[test]]
name = "quantum_simulator"
path = "tests/quantum_simulator.rs"

[[test]]
name = "encoding_builtins"
path = "tests/encoding_builtins.rs"

[profile.dev]
debug = 2

[profile.release]
debug = 0
