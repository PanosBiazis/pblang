[package]
name = "pblang"
version = "0.1.0"
edition = "2021"
autotests = false

[workspace]
members = [
    "crates/pblang-core",
    "crates/pblang-ir",
    "crates/pblang-vm",
    "crates/pblang-compiler",
    "crates/pblang-typeck",
    "crates/pblang-ffi",
    "crates/pblang-pm",
    "crates/pblang-lsp",
    "crates/pblang-graphics",
]

[dependencies]
pblang-core     = { path = "crates/pblang-core" }
pblang-ir       = { path = "crates/pblang-ir" }
pblang-vm       = { path = "crates/pblang-vm" }
pblang-compiler = { path = "crates/pblang-compiler" }
pblang-typeck   = { path = "crates/pblang-typeck" }
pblang-pm       = { path = "crates/pblang-pm" }
pblang-graphics = { path = "crates/pblang-graphics" }
chumsky         = "0.8"
serde_json      = "1.0"

[dev-dependencies]
criterion  = "0.5"
flate2     = "1.0"
tar        = "0.4"
sha2       = "0.10"
hex        = "0.4"

[[bench]]
name    = "bench_vm"
harness = false
path    = "benches/bench_vm.rs"

[[test]]
name = "semantics"
path = "tests/semantics.rs"

[[test]]
name = "pack"
path = "tests/pack.rs"

[[test]]
name = "cfg"
path = "tests/cfg.rs"

[[test]]
name = "new_cmd"
path = "tests/new_cmd.rs"

[profile.dev]
debug = 0

[profile.release]
debug = 0
