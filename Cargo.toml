[package]
name = "pblang"
version = "0.5.7"
edition = "2021"
autotests = false
description = "A fast, secure, embeddable programming language with bytecode VM"
license = "MIT"
keywords = ["language", "interpreter", "bytecode", "vm", "embedded"]
categories = ["compilers", "command-line-utilities"]

[workspace.package]
version = "0.5.7"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chumsky = "=1.0.0-alpha.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
flate2 = "1"
tar = "0.4"
tempfile = "3"
walkdir = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std"] }
criterion = "0.5"

[workspace]
members = [
    "crates/pblang-core",
    "crates/pblang-ir",
    "crates/pblang-vm",
    "crates/pblang-compiler",
    "crates/pblang-typeck",
    "crates/pblang-lint",
    "crates/pblang-ffi",
    "crates/pblang-pm",
    "crates/pblang-lsp",
    "crates/pblang-graphics",
    "crates/pblang-stub",
    "crates/pblang-cranelift",
    "crates/pblang-ctranspiler",
    "crates/pblang-ai",
    "crates/pblang-quantum",
    "crates/pblang-wasm",
    "crates/pblang-llvm",
]
# `fuzz/` is a cargo-fuzz harness that requires nightly + libFuzzer
# linkage; keep it out of the regular workspace build.
exclude = ["fuzz"]

[dependencies]
pblang-core        = { path = "crates/pblang-core" }
pblang-ir          = { path = "crates/pblang-ir" }
pblang-vm          = { path = "crates/pblang-vm" }
pblang-compiler    = { path = "crates/pblang-compiler" }
pblang-typeck      = { path = "crates/pblang-typeck" }
pblang-lint        = { path = "crates/pblang-lint" }
pblang-pm          = { path = "crates/pblang-pm" }
pblang-graphics    = { path = "crates/pblang-graphics" }
pblang-ctranspiler = { path = "crates/pblang-ctranspiler" }
pblang-llvm = { path = "crates/pblang-llvm" }
pblang-wasm = { path = "crates/pblang-wasm" }
pblang-lsp = { path = "crates/pblang-lsp" }
pblang-cranelift = { path = "crates/pblang-cranelift" }
chumsky            = { workspace = true }
serde_json         = { workspace = true }
walkdir            = { workspace = true }
tokio              = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-std", "net", "signal"] }
clap               = { version = "4", features = ["derive"] }
axum               = { version = "0.7", features = ["ws", "http2"] }
axum-server        = { version = "0.7", features = ["tls-rustls"] }
rustls             = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile     = "2"
tower              = "0.5"
tower-http         = { version = "0.5", features = ["cors", "limit"] }

[features]
# Opt-in GPU compute backend (wgpu) for tensor_matmul. OFF by default so the normal
# build stays lean and fully deterministic (CPU f64). Build with `cargo build
# --features gpu`; at runtime it is still gated behind PBLANG_GPU=1 (GPU math is f32).
gpu = ["pblang-vm/gpu"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion  = { workspace = true }
flate2     = { workspace = true }
tar        = { workspace = true }
tempfile   = { workspace = true }
sha2       = { workspace = true }
hex        = { workspace = true }
# WebSocket test (tests/new_cmd.rs::serve_websocket_*) needs to compute
# Sec-WebSocket-Accept on the client side. Pinned through transitive
# axum/rustls deps; safe to use here.
base64     = "0.22"
sha1       = "0.10"
pblang-ir        = { path = "crates/pblang-ir" }

[[bin]]
name = "pblang"
path = "src/main.rs"

[[bench]]
name    = "bench_vm"
harness = false
path    = "benches/bench_vm.rs"

[[test]]
name = "semantics"
path = "tests/semantics.rs"

[[test]]
name = "pack"
path = "tests/pack.rs"

[[test]]
name = "cfg"
path = "tests/cfg.rs"

[[test]]
name = "new_cmd"
path = "tests/new_cmd.rs"

[[test]]
name = "lsp"
path = "tests/lsp.rs"

[[test]]
name = "install_cli"
path = "tests/install_cli.rs"

[[test]]
name = "threads"
path = "tests/threads.rs"

[[test]]
name = "typeck_compiler"
path = "tests/typeck_compiler.rs"

[[test]]
name = "lockfile_repro"
path = "tests/lockfile_repro.rs"

[[test]]
name = "tensor_builtins"
path = "tests/tensor_builtins.rs"

[[test]]
name = "string_limits"
path = "tests/string_limits.rs"

[[test]]
name = "signal_builtins"
path = "tests/signal_builtins.rs"

[[test]]
name = "neural_net_builtins"
path = "tests/neural_net_builtins.rs"

[[test]]
name = "quantum_simulator"
path = "tests/quantum_simulator.rs"

[[test]]
name = "encoding_builtins"
path = "tests/encoding_builtins.rs"

[[test]]
name = "annotate"
path = "tests/annotate.rs"

[[test]]
name = "block_expr"
path = "tests/block_expr.rs"

[[test]]
name = "call_graph"
path = "tests/call_graph.rs"

[[test]]
name = "dataflow"
path = "tests/dataflow.rs"

[[test]]
name = "doc_cli"
path = "tests/doc_cli.rs"

[[test]]
name = "dump_bytecode"
path = "tests/dump_bytecode.rs"

[[test]]
name = "fmt"
path = "tests/fmt.rs"

[[test]]
name = "golden"
path = "tests/golden.rs"

[[test]]
name = "http_server"
path = "tests/http_server.rs"

[[test]]
name = "if_else"
path = "tests/if_else.rs"

[[test]]
name = "lint"
path = "tests/lint.rs"

[[test]]
name = "modules"
path = "tests/modules.rs"

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"

[[test]]
name = "stdlib_parse"
path = "tests/stdlib_parse.rs"

[[test]]
name = "symbols"
path = "tests/symbols.rs"

[[test]]
name = "selfhost_drift"
path = "tests/selfhost_drift.rs"

[[test]]
name = "fmt_drift"
path = "tests/fmt_drift.rs"

[profile.dev]
debug = 2

[profile.release]
debug = 0
