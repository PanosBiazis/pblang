[package]
name = "biapryx"
version = "0.1.0"
edition = "2021"
autotests = false

[workspace]
members = [
    "crates/biapryx-core",
    "crates/biapryx-ir",
    "crates/biapryx-vm",
    "crates/biapryx-compiler",
    "crates/biapryx-typeck",
    "crates/biapryx-ffi",
    "crates/biapryx-pm",
    "crates/biapryx-lsp",
    "crates/biapryx-graphics",
    "crates/biapryx-stub",
]

[dependencies]
biapryx-core = { path = "crates/biapryx-core" }
biapryx-ir = { path = "crates/biapryx-ir" }
biapryx-vm   = { path = "crates/biapryx-vm" }
biapryx-compiler = { path = "crates/biapryx-compiler"}
biapryx-typeck = { path = "crates/biapryx-typeck" }
biapryx-pm = { path = "crates/biapryx-pm" }
biapryx-graphics = { path = "crates/biapryx-graphics" }
chumsky = "0.8"
libloading = "0.8"
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
serde_json = "1.0"
tempfile = "3.14"

[[bench]]
name = "bench_vm"
harness = false
path = "benches/bench_vm.rs"

[[test]]
name = "parser_ast"
path = "tests/parser_ast.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[[test]]
name = "vm_smoke"
path = "tests/vm_smoke.rs"

[[test]]
name = "red_features"
path = "tests/red_features.rs"


[[test]]
name = "print_collect"
path = "tests/print_collect.rs"

[[test]]
name = "block_expr"
path = "tests/block_expr.rs"

[[test]]
name = "if_else"
path = "tests/if_else.rs"

[[test]]
name = "semantics"
path = "tests/semantics.rs"

[[test]]
name = "modules"
path = "tests/modules.rs"

[[test]]
name = "http_server"
path = "tests/http_server.rs"

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"

[[test]]
name = "golden"
path = "tests/golden.rs"

[[test]]
name = "lockfile_repro"
path = "tests/lockfile_repro.rs"

[[test]]
name = "stdlib_parse"
path = "tests/stdlib_parse.rs"

[[test]]
name = "fmt"
path = "tests/fmt.rs"

[[test]]
name = "install_cli"
path = "tests/install_cli.rs"

[[test]]
name = "pack"
path = "tests/pack.rs"

[[test]]
name = "threads"
path = "tests/threads.rs"

[[test]]
name = "doc_cli"
path = "tests/doc_cli.rs"

[[test]]
name = "dump_bytecode"
path = "tests/dump_bytecode.rs"

[[test]]
name = "lint"
path = "tests/lint.rs"

[[test]]
name = "call_graph"
path = "tests/call_graph.rs"

[[test]]
name = "annotate"
path = "tests/annotate.rs"

[[test]]
name = "dataflow"
path = "tests/dataflow.rs"

[[test]]
name = "symbols"
path = "tests/symbols.rs"

[[test]]
