[package]
name = "pblang-cranelift"
version = "0.5.7"
edition = "2021"
description = "Cranelift JIT backend for pblang (N2-beta prototype)"

[dependencies]
pblang-ir = { path = "../pblang-ir" }
cranelift-codegen = { version = "0.131", features = ["x86"] }
cranelift-frontend = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"
cranelift-object = "0.131"
