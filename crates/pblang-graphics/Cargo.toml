[package]
name = "pblang-graphics"
version = "0.5.7"
edition = "2021"

[features]
default = []
graphics = []        # minifb always enabled
# sdl2: optional backend with native OS window (min/max/close).
#   Windows + vcpkg: install SDL2 with vcpkg install sdl2:x64-windows, then build with:
#     $env:VCPKG_ROOT = "C:\path\to\vcpkg"
#     $env:VCPKGRS_TRIPLET = "x64-windows"
#     $env:VCPKGRS_DYNAMIC = "1"
#     cargo build -p pblang --features pblang-graphics/sdl2
#   Run with SDL2: set PBLANG_GFX=sdl2; copy SDL2.dll to target\debug\ or PATH.
sdl2 = ["dep:sdl2"]

[dependencies]
pblang-ir = { path = "../pblang-ir" }
minifb = "0.28"
# SDL2 discovery is platform-specific: pkg-config on Unix (Linux/macOS, where
# `pkg-config --exists sdl2` is the norm) and vcpkg on Windows. Declaring the
# optional `sdl2` dep here and adding the right discovery feature per target
# below makes `--features sdl2` build out of the box on each OS. (It previously
# hard-coded `use-vcpkg`, so the feature failed on Linux with `VcpkgNotFound`
# even when SDL2 was installed and visible to pkg-config.)
sdl2 = { version = "0.35", optional = true }

[target.'cfg(unix)'.dependencies]
sdl2 = { version = "0.35", optional = true, features = ["use-pkgconfig"] }

[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.35", optional = true, features = ["use-vcpkg"] }
