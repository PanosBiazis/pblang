[package]
name = "pblang-graphics"
version = "0.5.7"
edition = "2021"

[features]
default = []
graphics = []        # minifb always enabled
# sdl2: optional backend with native OS window (min/max/close).
#   Windows + vcpkg: install SDL2 with vcpkg install sdl2:x64-windows, then build with:
#     $env:VCPKG_ROOT = "C:\path\to\vcpkg"
#     $env:VCPKGRS_TRIPLET = "x64-windows"
#     $env:VCPKGRS_DYNAMIC = "1"
#     cargo build -p pblang --features pblang-graphics/sdl2
#   Run with SDL2: set PBLANG_GFX=sdl2; copy SDL2.dll to target\debug\ or PATH.
sdl2 = ["dep:sdl2"]

[dependencies]
pblang-ir = { path = "../pblang-ir" }
sdl2 = { version = "0.35", optional = true, features = ["use-vcpkg"] }
minifb = "0.28"
