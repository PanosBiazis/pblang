[package]
name = "pblang-graphics"
version = "0.5.7"
edition = "2021"

[features]
default = []
graphics = []        # minifb always enabled
# sdl2: optional backend with native OS window (min/max/close).
#   Windows + vcpkg: install SDL2 with vcpkg install sdl2:x64-windows, then build with:
#     $env:VCPKG_ROOT = "C:\path\to\vcpkg"
#     $env:VCPKGRS_TRIPLET = "x64-windows"
#     $env:VCPKGRS_DYNAMIC = "1"
#     cargo build -p pblang --features pblang-graphics/sdl2
#   Run with SDL2: set PBLANG_GFX=sdl2; copy SDL2.dll to target\debug\ or PATH.
sdl2 = ["dep:sdl2"]
# wgpu-render: EXPERIMENTAL, OFF-BY-DEFAULT GPU rendering backend scaffold.
#   Real wgpu Surface + swapchain + instanced solid-rect pipeline (M1). Everything
#   is gated behind this feature; with it off, none of the code or deps below are
#   compiled and the default build is byte-for-byte unaffected. Runtime selection
#   also requires PBIDE_GRAPHICS=wgpu (or PBLANG_GFX=wgpu). See docs/GPU_RENDER_PLAN.md.
#   NOTE: written without a Rust toolchain available — must be built/tested with
#     cargo build -p pblang-graphics --features wgpu-render
#   before use.
wgpu-render = ["dep:wgpu", "dep:raw-window-handle", "dep:pollster", "dep:bytemuck"]

[dependencies]
pblang-ir = { path = "../pblang-ir" }
minifb = "0.28"
fontdue = "0.9"
# SDL2 discovery is platform-specific: pkg-config on Unix (Linux/macOS, where
# `pkg-config --exists sdl2` is the norm) and vcpkg on Windows. Declaring the
# optional `sdl2` dep here and adding the right discovery feature per target
# below makes `--features sdl2` build out of the box on each OS. (It previously
# hard-coded `use-vcpkg`, so the feature failed on Linux with `VcpkgNotFound`
# even when SDL2 was installed and visible to pkg-config.)
sdl2 = { version = "0.35", optional = true }
# Optional wgpu render backend deps (only pulled in by `wgpu-render`). Version pinned
# to match pblang-vm's compute backend (wgpu 0.24) so a single device can be shared
# via `pblang_vm::vm::gpu::shared_device()` without an ABI/type mismatch.
wgpu = { version = "24", optional = true }
raw-window-handle = { version = "0.6", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
sdl2 = { version = "0.35", optional = true, features = ["use-pkgconfig"] }

[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.35", optional = true, features = ["use-vcpkg"] }
