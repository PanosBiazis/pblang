[package]
name = "pblang-vm"
version = "0.6.0"
edition = "2021"

[features]
# GPU compute backend via wgpu (opt-in; default build is CPU-only and deterministic).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
pblang-core = { path = "../pblang-core" }
pblang-ir   = { path = "../pblang-ir" }
pblang-compiler = { path = "../pblang-compiler" }
pblang-graphics = { path = "../pblang-graphics" }
pblang-ai = { path = "../pblang-ai" }
pblang-cranelift = { path = "../pblang-cranelift" }
pblang-quantum = { path = "../pblang-quantum" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
pblang-pm = { path = "../pblang-pm" }
libloading = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.21"
sha1 = "0.10"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.1"
regex = "1"
rayon = "1"
webpki-roots = "0.26"
# Optional GPU compute backend (enabled by the `gpu` feature). Heavy deps, so opt-in.
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
rustls-native-certs = "0.8"
libc = "0.2"
