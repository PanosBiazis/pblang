[package]
name = "pblang-vm"
version = "0.5.0"
edition = "2021"

[dependencies]
pblang-core = { path = "../pblang-core" }
pblang-ir   = { path = "../pblang-ir" }
pblang-compiler = { path = "../pblang-compiler" }
pblang-graphics = { path = "../pblang-graphics" }
pblang-ai = { path = "../pblang-ai" }
pblang-quantum = { path = "../pblang-quantum" }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
pblang-pm = { path = "../pblang-pm" }
libloading = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.21"
sha1 = "0.10"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.1"
regex = "1"
webpki-roots = "0.26"
rustls-native-certs = "0.7"
