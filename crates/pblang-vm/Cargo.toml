[package]
name = "pblang-vm"
version = "0.1.0"
edition = "2021"

[dependencies]
pblang-core = { path = "../pblang-core" }
pblang-ir   = { path = "../pblang-ir" }
pblang-compiler = { path = "../pblang-compiler" }
pblang-graphics = { path = "../pblang-graphics" }
serde_json = "1"
ureq = "2"
pblang-pm = { path = "../pblang-pm" }
libloading = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.21"
sha1 = "0.10"
