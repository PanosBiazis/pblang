[package]
name = "pblang-lsp"
version = "2.0.0"
edition = "2021"

[lib]
name = "pblang_lsp"
path = "src/lib.rs"

[[bin]]
name = "pblang-lsp"
path = "src/main.rs"

[dependencies]
pblang-core = { path = "../pblang-core" }
pblang-typeck = { path = "../pblang-typeck" }
chumsky = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp = "0.20"
