[package]
name = "pb-mcp-server-pblang"
version = "0.1.0"
description = "pblang-native port foundation for pb-mcp-server"
entry = "main.sapp"

[dependencies]
# When vendored at stdlib/ai/pbai/tools/mcp-servers/pb-mcp-server, the pblang
# stdlib is five levels up (../../../../..). Fallbacks keep standalone checkouts working.
stdlib = { path = "../../../../..", paths = ["../../../pl-dev/pblang/stdlib", "../../../../pl-dev/pblang/stdlib"] }

[metadata]
language = "pblang"
edition = "2024"
