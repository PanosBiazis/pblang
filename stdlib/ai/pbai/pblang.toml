[package]
name = "pbai"
version = "0.1.0"
description = "pbAI native model work, implemented in pblang"
entry = "tests/semantics/pbai_test.sapp"

[dependencies]
# Resolves across checkout layouts (first existing wins): a flat Windows checkout
# (E:\pbai + E:\pblang) and the original Linux tree (AAP/ai/pbai + AAP/pl-dev/pblang).
# When vendored inside pblang at stdlib/ai/pbai, the pblang stdlib is two levels
# up (../..). Fallbacks keep the standalone Windows/Linux checkouts working.
stdlib = { path = "../..", paths = ["../pblang/stdlib", "../../pl-dev/pblang/stdlib"] }

[metadata]
language = "pblang"
edition = "2024"
