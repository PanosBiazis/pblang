<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pblang IDE — Smart Code Editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'JetBrains Mono', 'Fira Code', monospace; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
#toolbar { background: #16213e; padding: 8px 16px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #0f3460; }
#toolbar button { background: #0f3460; color: #e94560; border: 1px solid #e94560; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 13px; }
#toolbar button:hover { background: #e94560; color: #fff; }
#toolbar button.run { background: #00b894; border-color: #00b894; color: #fff; }
#toolbar button.run:hover { background: #00d2a0; }
#toolbar select { background: #0f3460; color: #e0e0e0; border: 1px solid #0f3460; padding: 6px; border-radius: 4px; font-family: inherit; }
#toolbar .title { font-size: 14px; font-weight: bold; color: #e94560; margin-right: auto; }
#main { display: flex; flex: 1; overflow: hidden; }
#editor-pane { flex: 1; display: flex; flex-direction: column; }
#editor { flex: 1; background: #1a1a2e; color: #e0e0e0; border: none; padding: 16px; font-family: inherit; font-size: 14px; resize: none; outline: none; line-height: 1.6; tab-size: 4; }
#output-pane { width: 400px; background: #0d1117; border-left: 1px solid #0f3460; display: flex; flex-direction: column; }
#output-header { padding: 8px 16px; background: #16213e; font-size: 13px; font-weight: bold; color: #00b894; }
#output { flex: 1; padding: 16px; overflow-y: auto; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
#output.error { color: #e94560; }
#output.info { color: #00b894; }
#statusbar { background: #16213e; padding: 4px 16px; font-size: 12px; color: #888; display: flex; gap: 16px; border-top: 1px solid #0f3460; }
#statusbar span { color: #00b894; }
</style>
</head>
<body>

<div id="toolbar">
  <span class="title">⚡ pblang IDE v0.5.7</span>
  <button class="run" onclick="runCode()">▶ Run (Ctrl+Enter)</button>
  <button onclick="formatCode()">🎨 Format</button>
  <button onclick="clearOutput()">🗑 Clear</button>
  <select id="examples" onchange="loadExample()">
    <option value="">📂 Examples...</option>
    <option value="hello">Hello World</option>
    <option value="fib">Fibonacci</option>
    <option value="http">HTTP Server</option>
    <option value="thread">Threads & Channels</option>
    <option value="quantum">Quantum Circuit</option>
    <option value="blockchain">Blockchain Mine</option>
    <option value="ml">ML Normalize</option>
  </select>
  <button onclick="toggleTheme()">🌓 Theme</button>
</div>

<div id="main">
  <div id="editor-pane">
    <textarea id="editor" spellcheck="false">// pblang IDE — Smart Code Editor
// "One programming language to create anything"

fn greet(name) {
    return "Hello, " + name + "! Welcome to pblang!";
}

print(greet("Developer"));
print("Today is " + now_iso());
print("2^10 = " + str(num_pow(2, 10)));
</textarea>
  </div>
  <div id="output-pane">
    <div id="output-header">📤 Output</div>
    <div id="output"></div>
  </div>
</div>

<div id="statusbar">
  <span id="linecol">Ln 1, Col 1</span>
  <span id="chars">0 chars</span>
  <span>pblang v0.5.7 | AI/Quantum/Web Ready</span>
</div>

<script>
const editor = document.getElementById('editor');
const output = document.getElementById('output');
const linecol = document.getElementById('linecol');
const chars = document.getElementById('chars');

// Update status bar
editor.addEventListener('input', updateStatus);
editor.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); runCode(); }
  if (e.key === 'Tab') { e.preventDefault(); insertTab(); }
  updateStatus();
});
editor.addEventListener('click', updateStatus);

function updateStatus() {
  const text = editor.value;
  const pos = editor.selectionStart;
  const lines = text.substr(0, pos).split('\n');
  linecol.textContent = 'Ln ' + lines.length + ', Col ' + (lines[lines.length-1].length + 1);
  chars.textContent = text.length + ' chars';
}

function insertTab() {
  const start = editor.selectionStart;
  editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(editor.selectionEnd);
  editor.selectionStart = editor.selectionEnd = start + 4;
}

async function runCode() {
  const code = editor.value;
  output.className = 'info';
  output.textContent = 'Running...\n';
  
  try {
    const response = await fetch('http://localhost:8090/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code })
    });
    const result = await response.json();
    if (result.error) {
      output.className = 'error';
      output.textContent = 'ERROR: ' + result.error;
    } else {
      output.className = 'info';
      output.textContent = result.output || '(no output)';
    }
  } catch(e) {
    output.className = 'error';
    output.textContent = 'Cannot connect to pblang server.\nStart it with: pblang serve --port 8090\n\n' + e.message;
  }
}

function formatCode() {
  // Simple formatting: consistent indentation
  let lines = editor.value.split('\n');
  let result = [];
  let indent = 0;
  for (let line of lines) {
    let trimmed = line.trim();
    if (trimmed === '') { result.push(''); continue; }
    if (trimmed.startsWith('}') || trimmed.startsWith(')') || trimmed.startsWith(']')) {
      indent = Math.max(0, indent - 1);
    }
    result.push('    '.repeat(indent) + trimmed);
    if (trimmed.endsWith('{') || trimmed.endsWith('(') || trimmed.endsWith('[')) {
      indent++;
    }
  }
  editor.value = result.join('\n');
  updateStatus();
}

function clearOutput() {
  output.textContent = '';
  output.className = '';
}

function loadExample() {
  const sel = document.getElementById('examples').value;
  const examples = {
    hello: '// Hello World\nprint("Hello, pblang!");\nprint("One language to create anything.");',
    fib: 'fn fib(n) {\n  if n <= 1 { return n; }\n  return fib(n-1) + fib(n-2);\n}\nprint("fib(20) = " + str(fib(20)));',
    http: 'let server = import("stdlib:http_server.sapp");\nprint("HTTP server example loaded");\n// server.serve(8080, fn(req, res) { ... });',
    thread: 'let ch = channel();\nspawn(fn() {\n  send(ch.sender, "Hello from thread!");\n});\nlet msg = recv(ch.receiver);\nprint(msg);',
    quantum: 'let q = import("stdlib:quantum.sapp");\nprint("Quantum module loaded");\n// q.run(circuit) to execute',
    blockchain: 'let bc = import("stdlib:blockchain.sapp");\nlet wallet = bc.create_wallet();\nprint("Wallet: " + wallet.address);',
    ml: 'let ml = import("stdlib:machine_learning.sapp");\nlet data = [1,2,3,4,5];\nlet norm = ml.normalize_minmax(data);\nprint("Normalized: " + json_stringify(norm));'
  };
  if (examples[sel]) { editor.value = examples[sel]; updateStatus(); }
  document.getElementById('examples').value = '';
}

let dark = true;
function toggleTheme() {
  dark = !dark;
  if (dark) {
    document.body.style.background = '#1a1a2e';
    editor.style.background = '#1a1a2e';
    editor.style.color = '#e0e0e0';
  } else {
    document.body.style.background = '#ffffff';
    editor.style.background = '#f5f5f5';
    editor.style.color = '#333';
  }
}
</script>
</body>
</html>
